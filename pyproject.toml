[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "outreach-studio"
version = "0.1.0"
description = "Tailored outreach emails written by a panel of AI agents that draft independently, judge each other blind, and ask you when they disagree."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Rozhina Lotfi" }]
keywords = ["email", "outreach", "llm", "multi-agent", "openai", "anthropic", "gemini"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
outreach-studio = "outreach_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/outreach_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501"]
